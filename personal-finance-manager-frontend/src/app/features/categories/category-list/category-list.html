<main>
  <header class="d-flex flex-row">
    <h1>categories</h1>
    <button type="button" class="btn btn-primary" (click)="categoryDialog.open()">
      Add category
    </button>
  </header>
  @for (category of categories(); track category.id) {
    <div class="d-flex flex-row align-items-center justify-content-between">
      <div>{{ category.name }} - {{ category.type }}</div>
      <div class="actions">
        <app-icon-button
          icon="edit"
          label="Edit category"
          (click)="openEditDialog(category, editDialog)"
        />
        <app-icon-button
          icon="delete"
          label="Delete category"
          (click)="openDeleteDialog(category, deleteDialog)"
        />
      </div>
    </div>
  }

  <app-delete-confirmation-dialog
    #deleteDialog
    [itemName]="selectedCategory()?.name ?? ''"
    [loading]="deleting()"
    [error]="responseError()"
    (confirmed)="confirmDelete()"
    (closed)="selectedCategory.set(null)"
  />
  <app-dialog
    #categoryDialog
    title="Create category"
    [hasChanges]="createForm.hasChanges() || createForm.loading()"
    (closeBlocked)="confirmation.open(createForm, categoryDialog)"
    (closed)="createForm.reset()"
  >
    <app-category-form #createForm (saved)="onCategorySaved(categoryDialog)" />
  </app-dialog>
  <app-dialog
    #editDialog
    title="Edit category"
    [hasChanges]="editForm.hasChanges() || editForm.loading()"
    (closeBlocked)="confirmation.open(editForm, editDialog)"
    (closed)="onEditClosed(editForm)"
  >
    <app-category-form
      #editForm
      [updateForm]="selectedCategory()"
      (saved)="onCategorySaved(editDialog)"
    />
  </app-dialog>

  <app-save-changes-dialog #confirmation />
  
</main>
