<form [formGroup]="form" (ngSubmit)="submit()">
  <fieldset [disabled]="loading()" class="border-0 p-0">
      <app-input
        [inputId]="formId + '-name'"
        label="Name"
        [control]="form.controls.name"
        [error]="
          !form.controls.name.touched ? ''
            : form.controls.name.hasError('required') ? 'Name is required.'
            : form.controls.name.hasError('maxlength') ? 'Maximum 50 characters.' : ''
        "
      />
    <app-select
      [inputId]="formId + '-type'"
      label="Type"
      [control]="form.controls.type"
      [options]="typeOptions"
      [error]="form.controls.type.touched && form.controls.type.hasError('required') ? 'Type is required.' : ''"
    />

    <div class="response-error">
      {{ responseError() }}
    </div>

    <div class="form-actions">
      <button
        type="submit"
        class="btn btn-primary"
        [disabled]="form.invalid || loading() || !hasChanges()"
      >
        @if (loading()) {
          <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
          Saving...
        } @else {
          @if (this.updateForm()) {
            Save
          } @else {
            Add category
          }
        }
      </button>
    </div>
  </fieldset>
</form>
