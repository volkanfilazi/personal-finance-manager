<form [formGroup]="form" (ngSubmit)="submit()">
  <fieldset [disabled]="loading()" class="border-0 p-0">
    <app-input
      [inputId]="formId + '-amount'"
      label="Amount"
      type="number"
      [min]="0.01"
      step="any"
      [control]="form.controls.amount"
      [error]="
        !form.controls.amount.touched
          ? ''
          : form.controls.amount.hasError('required')
            ? 'Amount is required.'
            : form.controls.amount.hasError('min')
              ? 'Minimum amount is 0.01.'
              : ''
      "
    />

    <app-input
      [inputId]="formId + '-month-year'"
      label="Year / Month"
      type="month"
      [control]="form.controls.monthYear"
      [error]="
        !form.controls.monthYear.touched
          ? ''
          : form.controls.monthYear.hasError('required')
            ? 'Year - Month is required.'
            : ''
      "
    />

    <app-select
      [inputId]="formId + '-category'"
      label="Category"
      [control]="form.controls.categoryId"
      [options]="categoryOptions()"
      [error]="
        form.controls.categoryId.touched && form.controls.categoryId.hasError('required')
          ? 'Category is required.'
          : ''
      "
    />

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">
        @if (loading()) {
          <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
          Saving...
        } @else {
          @if (this.updateForm()) {
            Save
          } @else {
            Add budget
          }
        }
      </button>
    </div>

    @if (responseError()) {
      <p class="text-danger" role="alert">{{ responseError() }}</p>
    }
  </fieldset>
</form>
