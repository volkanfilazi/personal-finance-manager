<form [formGroup]="form" (ngSubmit)="submit()">
  <fieldset [disabled]="loading()" class="border-0 p-0">
    <app-textarea
      [inputId]="formId + '-name'"
      label="Description"
      [control]="form.controls.description"
      [error]="!form.controls.description.touched ? ''
        : form.controls.description.hasError('required') ? 'Description is required.'
        : form.controls.description.hasError('maxlength') ? 'Maximum 200 characters.' : ''"
    />

      <app-input
        [inputId]="formId + '-amount'"
        label="Amount"
        type="number"
        [min]="0.01"
        [step]="0.01"
        [control]="form.controls.amount"
        [error]="
          !form.controls.amount.touched
            ? ''
            : form.controls.amount.hasError('required')
              ? 'Amount is required.'
              : form.controls.amount.hasError('min')
                ? 'Minimum amount is 0.01.'
                : form.controls.amount.hasError('pattern')
                  ? 'Use at most two decimal places.'
                  : ''
        "
      />

      <app-input
        [inputId]="formId + '-date'"
        label="Date"
        type="date"
        [control]="form.controls.date"
        [error]="
          !form.controls.date.touched
            ? ''
            : form.controls.date.hasError('required')
              ? 'Date is required.'
              : ''
        "
      />

      <app-select
        [inputId]="formId + '-category'"
        label="Category"
        [control]="form.controls.categoryId"
        [options]="categoryOptions()"
        [error]="form.controls.categoryId.touched && form.controls.categoryId.hasError('required') ? 'Category is required.' : ''"
      />

    <div class="form-actions">
      <app-text-button
        type="submit"
        [label]="this.updateForm() ? 'Save' : 'Add transaction'"
        [loading]="loading()"
      ></app-text-button>
    </div>

    @if (responseError()) {
      <p class="text-danger" role="alert">{{ responseError() }}</p>
    }
  </fieldset>
</form>
