<app-form-field [inputId]="inputId()" [label]="label()" [error]="error()">
  @if (type() === 'number') {
    <input
      [id]="inputId()"
      type="number"
      [attr.min]="min()"
      [attr.max]="max()"
      [attr.step]="step()"
      class="form-control"
      [formControl]="control()"
      [attr.aria-invalid]="error() ? 'true' : null"
      [attr.aria-describedby]="error() ? inputId() + '-error' : null"
    />
  } @else {
    <input
      [id]="inputId()"
      [type]="type()"
      [attr.min]="min()"
      [attr.max]="max()"
      [attr.step]="step()"
      class="form-control"
      [formControl]="control()"
      [attr.aria-invalid]="error() ? 'true' : null"
      [attr.aria-describedby]="error() ? inputId() + '-error' : null"
    />
  }
</app-form-field>
